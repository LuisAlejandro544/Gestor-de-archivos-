name: Auto Unpack ZIP & Overwrite Codebase

on:
  push:
    paths:
      - 'zip/**.zip'
      - 'zip/*.zip'
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'Ruta del archivo .zip (ejemplo: zip/codigo.zip)'
        required: false
        default: 'zip/update.zip'

jobs:
  unpack_and_replace:
    name: Extraer ZIP y Reemplazar Código Fuente
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener Token de GitHub App (Bot Personalizado)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Localizar y Extraer Archivo ZIP
        run: |
          # Buscar si se especificó por workflow_dispatch o encontrar el primer zip en la carpeta zip/
          ZIP_FILE=""
          if [ -n "${{ github.event.inputs.zip_filename }}" ] && [ -f "${{ github.event.inputs.zip_filename }}" ]; then
            ZIP_FILE="${{ github.event.inputs.zip_filename }}"
          elif [ -d "zip" ]; then
            ZIP_FILE=$(find zip -maxdepth 2 -name "*.zip" | head -n 1)
          fi

          # Fallback si se subió a otro nivel
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" ! -path "./.git/*" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "❌ No se encontró ningún archivo .zip en la carpeta 'zip/' para descomprimir."
            exit 1
          fi

          echo "📦 Archivo ZIP localizado: $ZIP_FILE"
          echo "📂 Descomprimiendo y reemplazando código fuente en el directorio raíz..."

          # Descomprimir sobreescribiendo en la raíz
          unzip -o "$ZIP_FILE" -d .

          # Eliminar el archivo .zip procesado para mantener el repositorio limpio
          rm -f "$ZIP_FILE"

          echo "✅ Código reemplazado correctamente."

      - name: Configurar Firma y Autenticación de Git
        run: |
          TOKEN="${{ steps.app-token.outputs.token }}"
          if [ -n "$TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          fi
          git config user.name "${{ secrets.BOT_NAME || 'ZArchiver AutoBot' }}"
          git config user.email "${{ secrets.BOT_APP_ID || '123456' }}+${{ secrets.BOT_NAME || 'zarchiver-bot' }}[bot]@users.noreply.github.com"

      - name: Commit y Push de los Cambios Reemplazados
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No hay cambios para confirmar."
          else
            git commit -m "refactor: reemplazo automático de código fuente desde archivo ZIP [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
