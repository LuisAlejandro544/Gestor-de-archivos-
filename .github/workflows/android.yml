name: Android Multi-Core APK Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK with C++/Rust Native Support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Entorno Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache de Gradle y Rust Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            target/
            app/build
          key: ${{ runner.os }}-build-cache-${{ hashFiles('**/*.gradle*', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Generar Llave en Caliente (Hot Keytool Keystore)
        run: |
          echo "Generando keystore temporal para firma en caliente de la APK..."
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore debug.keystore -storepass android -keypass android \
            -dname "CN=ZArchiver Debug, OU=Mobile, O=ZArchiver Corp, L=City, ST=State, C=US"
          cp debug.keystore app/debug.keystore

      - name: Conceder permisos de ejecución a Gradle
        run: chmod +x gradlew || true

      - name: Compilar APK (${{ inputs.build_type }})
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: zarchiver-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
