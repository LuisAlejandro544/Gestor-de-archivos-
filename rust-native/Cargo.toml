[package]
name = "rust_archive_engine"
version = "0.1.0"
edition = "2021"
authors = ["ZArchiver Developer"]
description = "Rust multi-threaded LZMA2 high-ratio compression engine using secondary worker cores"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# JNI bindings for Android Kotlin integration
jni = "0.21.1"
rayon = "1.8.0" # Parallel multi-core threadpool processing
flate2 = "1.0.28" # High speed Gzip/Deflate compression algorithm
